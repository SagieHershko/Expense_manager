name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # ---- Job 1: בדיקות ----
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # אין cache כאן — package-lock.json לא נמצא ב-repo

      # התקנת build tools ל-better-sqlite3
      # python-is-python3 יוצר symlink: python -> python3
      # (node-gyp דורש "python", לא "python3")
      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python-is-python3 make g++

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Run tests with coverage
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key_for_ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/

  # ---- Job 2: בניית Docker ----
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend -t expense-manager-backend

      - name: Build frontend image
        run: docker build ./frontend -t expense-manager-frontend

  # ---- Job 3: יצירת Release (רק כשמוסיפים git tag) ----
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## מה חדש בגרסה הזו?
            ראה את ה-release notes האוטומטיים למטה.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
