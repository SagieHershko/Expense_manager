# docker-compose — מנהל מספר Containers יחד
# במקום להריץ כל container בנפרד, פקודה אחת מפעילה הכל

version: '3.8'

services:
  # ---- Database Container (Postgres) ----
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=expense
      - POSTGRES_PASSWORD=expense
      - POSTGRES_DB=expense_manager
    volumes:
      # הנתונים נשמרים גם כשה-container נמחק ומורץ מחדש
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---- Backend Container ----
  backend:
    build:
      context: ./backend   # Docker יחפש את ה-Dockerfile כאן
    ports:
      - "3000:3000"         # port_על_המחשב:port_בcontainer
    environment:
      - PORT=3000
      - JWT_SECRET=expense_manager_super_secret_key_2024
      - NODE_ENV=production
      - DATABASE_URL=postgres://expense:expense@db:5432/expense_manager
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy   # מחכה ש-Postgres יהיה מוכן לחיבורים
    restart: unless-stopped   # מפעיל מחדש אוטומטית אם קורסת

  # ---- Frontend Container ----
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"             # האתר יהיה זמין על http://localhost
    depends_on:
      - backend             # מחכה ש-backend יהיה מוכן לפני שעולה

# Volume — אחסון מתמיד שנשמר גם כשה-container נמחק
volumes:
  db_data:
